[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/data/*.json, licenses/*.txt"
exclude_filter="tools/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"CRI's CAMERETTA: il portfolio di Cristiano Battini (sviluppo, fisica, appunti, libri) come un piccolo gioco in pixel art.\"><link rel=\"canonical\" href=\"https://www.cristianobattini.com/\"><meta property=\"og:title\" content=\"CRI's CAMERETTA\"><meta property=\"og:url\" content=\"https://www.cristianobattini.com/\"><meta property=\"og:type\" content=\"website\"><style>html,body,canvas{background:#0f0f26}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
